name: ORION CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-checks:
    name: Backend Tests & Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r backend/requirements.txt
          pip install moto boto3 pytest pytest-asyncio

      - name: Run Backend Unit & Security Tests
        env:
          ENVIRONMENT: test
          SECRET_KEY: dummy-ci-secret-key-at-least-32-chars-long
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          STORAGE_PROVIDER: local
          STORAGE_LOCAL_DIR: ./storage/test_uploads
          GEMINI_API_KEY: dummy-ci-gemini-key-not-real
          PYTHONPATH: backend
        run: |
          pytest backend/tests/test_auth_backend.py backend/tests/test_multi_user_security_hardening.py backend/tests/test_storage_abstraction.py backend/tests/test_llm_quota_configuration.py backend/tests/test_llm_budget_estimator.py -v

  frontend-checks:
    name: Frontend Lint, TypeCheck, Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: TypeCheck TypeScript
        working-directory: ./frontend
        run: npx tsc -b

      - name: Run Vitest Unit Tests
        working-directory: ./frontend
        run: npm test -- --run

      - name: Production Vite Build
        working-directory: ./frontend
        run: npm run build

  docker-build:
    name: Docker Container Build Check
    runs-on: ubuntu-latest
    needs: [backend-checks, frontend-checks]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: orion-backend:ci-test

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: orion-frontend:ci-test
