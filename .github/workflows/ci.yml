name: ORION CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-checks:
    name: Backend Lint, TypeCheck & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff pytest pytest-asyncio

      - name: Run Ruff Linting
        run: |
          ruff check backend/app

      - name: Run Backend Unit & Integration Tests
        env:
          ORION_ENV: development
          DEV_AUTH_BYPASS: "true"
          STORAGE_PROVIDER: local
          STORAGE_LOCAL_DIR: ./storage/test_uploads
          DATABASE_URL: sqlite+aiosqlite:///:memory:
        run: |
          pytest backend/tests -v

  frontend-checks:
    name: Frontend Lint, TypeCheck, Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: TypeCheck TypeScript
        working-directory: ./frontend
        run: npx tsc -b

      - name: Run Vitest Unit Tests
        working-directory: ./frontend
        run: npm test

      - name: Production Vite Build
        working-directory: ./frontend
        run: npm run build
