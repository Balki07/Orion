[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "orion-backend"
version = "0.1.0"
description = "ORION - Production-Grade AI Research Assistant with Evidence-Grounded RAG"
readme = "../README.md"
requires-python = ">=3.11"
authors = [
    { name = "ORION Team", email = "research@orion-assistant.ai" }
]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "pgvector>=0.3.0",
    "aiosqlite>=0.20.0",
    "pymupdf>=1.24.0",
    "sentence-transformers>=3.0.0",
    "google-genai>=0.1.1",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "pyjwt[crypto]>=2.8.0",
    "numpy>=1.26.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
