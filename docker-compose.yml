services:
  db:
    image: pgvector/pgvector:pg16
    container_name: orion-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: orion
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orion"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: orion-backend
    restart: unless-stopped
    environment:
      - ENVIRONMENT=development
      - SECRET_KEY=${SECRET_KEY:-docker-compose-test-secret-key-32-chars-min}
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/orion
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash-lite}
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:80,http://127.0.0.1:5173
      - STORAGE_PROVIDER=local
      - STORAGE_LOCAL_DIR=/app/storage/uploads
      - DEV_AUTH_BYPASS=false
      - HNSW_EF_SEARCH=40
      - USER_DOCUMENT_LIMIT=50
    ports:
      - "8000:8000"
    volumes:
      - storage_uploads:/app/storage/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: orion-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
  storage_uploads:
