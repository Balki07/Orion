services:
  db:
    image: pgvector/pgvector:pg16
    container_name: orion-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: orion
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orion"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: orion-backend
    restart: unless-stopped
    environment:
      - ORION_ENV=production
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/orion
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-1.5-flash}
      - STORAGE_PROVIDER=local
      - STORAGE_LOCAL_DIR=/app/storage/uploads
      - DEV_AUTH_BYPASS=false
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET:-}
    ports:
      - "8000:8000"
    volumes:
      - storage_uploads:/app/storage/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: orion-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
  storage_uploads:
